const API='https://data.etabus.gov.hk/v1/transport/kmb',$=id=>document.getElementById(id);let step=2,routeItem,stops=[],timer,cache,cacheAt=0,busy=false,selected=null;const stopCache={};function loading(on,msg='正在讀取數據...'){$('load').style.display=on?'flex':'none';$('loadText').textContent=msg}async function get(u){let c=new AbortController,t=setTimeout(()=>c.abort(),9000);try{let r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error();return r.json()}finally{clearTimeout(t)}}async function routes(){if(cache&&Date.now()-cacheAt<6e4)return cache;cache=(await get(API+'/route/')).data||[];cacheAt=Date.now();return cache}function setEva(on,target){$('evaOverlay').style.display=on?'block':'none';$('header').classList.toggle('eva-header',on);document.querySelectorAll('.eva-card-lock').forEach(x=>x.classList.remove('eva-card-lock'));if(on&&target)target.classList.add('eva-card-lock')}function setStep(n){step=n;[2,3,4,5,6].forEach(i=>$('step'+i).classList.toggle('active',i===n));$('back').style.display=n>2?'block':'none';$('header').classList.toggle('kmb',n===4||n===5);$('header').classList.toggle('love',n===6);if(n===2||n===3||n===6)setEva(false);if(n===2){$('headMain').textContent='即時到站查詢';$('headSub').style.display='none';home()}if(n!==4&&n!==5){clearInterval(timer);selected=null}}function goBack(){setEva(false);setStep(step===5||step===6?2:step-1)}function fmt(t){return new Date(t).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:true})}function mins(t){return Math.max(0,Math.round((new Date(t)-Date.now())/6e4))}function up(a){return(a||[]).filter(x=>x?.eta&&new Date(x.eta)>new Date()).sort((a,b)=>new Date(a.eta)-new Date(b.eta))}function two(a){let x=up(a).slice(0,2);return x.length?x.map(e=>fmt(e.eta)+'（尚餘'+mins(e.eta)+'分鐘）').join('；'):'暫無即時班次'}function checkEasterEgg(){let x=$('route').value.trim()==='1227';$('searchBtn').classList.toggle('btn-gold',x);$('searchBtn').textContent=x?'幸福快車查詢':'查詢九巴和龍運巴士路線'}function love(){let s=new Date(2014,11,27),n=new Date(),d=Math.floor((n-s)/864e5)+1;$('headMain').textContent='幸福快車專用查詢';$('headSub').textContent='心愛老婆專屬';$('headSub').style.display='block';$('loveContent').innerHTML='<p class="text-lg font-bold text-rose-600">心愛的 Ding3 Ding1：</p><p>你已跟心愛老公相愛了 <span class="text-2xl love-days-highlight">'+d+'</span> 天</p><p>如想了解更多，請立即打電話給老公！</p><p class="text-right text-rose-600">心愛老公上</p>';setStep(6)}

/* 通過官方 route-stop 端點動態查找準確站點 ID 與到站時間 */
async function getRouteStops(r,bound='outbound',service='1'){let k=`rs_${r}_${bound}_${service}`;if(stopCache[k])return stopCache[k];try{let res=(await get(`${API}/route-stop/${r}/${bound}/${service}`)).data||[];if(res.length)stopCache[k]=res;return res}catch{return[]}}
async function getStopName(id){let k=`sn_${id}`;if(stopCache[k])return stopCache[k];try{let res=await get(`${API}/stop/${id}`);let n=res?.data?.name_tc||'';if(n)stopCache[k]=n;return n}catch{return''}}

async function findStopByQuery(r,bound='outbound',service='1',queryOrSeq=1){let rs=await getRouteStops(r,bound,service);if(!rs.length)return null;if(typeof queryOrSeq==='number'){let s=rs.find(x=>+x.seq===queryOrSeq)||rs[queryOrSeq-1]||rs[0];let name=await getStopName(s.stop);return{stop:s.stop,name:name||'',seq:s.seq}}for(let s of rs){let name=await getStopName(s.stop);if(name&&name.includes(queryOrSeq)){return{stop:s.stop,name,seq:s.seq}}}if(rs[0]){let name=await getStopName(rs[0].stop);return{stop:rs[0].stop,name:name||'',seq:rs[0].seq}}return null}

async function getEtaForStop(r,bound='outbound',service='1',queryOrSeq=1){try{let target=await findStopByQuery(r,bound,service,queryOrSeq);if(!target)return{stop:null,name:'',seq:1,etas:[]};let dir=bound==='outbound'?'O':'I';let raw=(await get(`${API}/eta/${target.stop}/${r}/${service}`)).data||[];let etas=raw.filter(x=>x.eta&&(x.dir===dir||!x.dir));return{stop:target.stop,name:target.name,seq:target.seq,etas}}catch{return{stop:null,name:'',seq:1,etas:[]}}}

async function home(){if(step!==2||busy)return;busy=true;try{let[d71a,d71b,d271out,d72x,d71r,d71br,d271r,d72x_rec,d72x_mk]=await Promise.all([getEtaForStop('71A','outbound','1',1),getEtaForStop('71B','outbound','1',1),getEtaForStop('271','outbound','1',1),getEtaForStop('72X','outbound','1','頌雅路'),getEtaForStop('71A','inbound','1','大埔墟'),getEtaForStop('71B','outbound','1','大埔中心'),getEtaForStop('271','inbound','1','廣福道'),getEtaForStop('72X','inbound','1','新填地街'),getEtaForStop('72X','inbound','1','旺角道')]);if(step===2){$('p71').textContent=two(d71a.etas);$('p71b').textContent=two(d71b.etas);$('p271out').textContent=two(d271out.etas);$('p72x').textContent=two(d72x.etas);$('p71r').textContent=two(d71r.etas);$('p71br').textContent=two(d71br.etas);$('p271r').textContent=two(d271r.etas);$('p72x_rec').textContent=two(d72x_rec.etas);$('p72x_mk').textContent=two(d72x_mk.etas)}}finally{busy=false}}

async function searchRoute(){let r=$('route').value.trim().toUpperCase();if(!r)return alert('請輸入路線號碼！');if(r==='1227')return love();loading(true);try{let d=(await routes()).filter(x=>x.route===r).map(x=>({route:x.route,bound:x.bound==='O'?'outbound':'inbound',service:x.service_type,orig:x.orig_tc,dest:x.dest_tc,desc:x.service_type==='1'?'常規班次':'特別班次 '+x.service_type}));if(!d.length)throw Error('找不到相關路線');$('bounds').innerHTML='';d.forEach(x=>{let b=document.createElement('button');b.className='option';b.innerHTML='<span><b class="tag">九巴／龍運</b>　'+x.desc+'：'+x.orig+' 往 '+x.dest+'</span><span>→</span>';b.onclick=()=>choose(x);$('bounds').appendChild(b)});setStep(3)}catch(e){alert(e.message||'查詢網絡失敗')}finally{loading(false)}}

function start(a,b,fn){setStep(5);$('headMain').textContent=a;$('headSub').textContent=b;$('headSub').style.display='block';fn();clearInterval(timer);timer=setInterval(fn,15000)}

function cards(c){let ai=-1;let html=c.map((x,i)=>{let a=up(x.etas);let soon=a[0]&&mins(a[0].eta)<=1;if(ai<0&&soon)ai=i;return(x.routeLabel?'<div class="route-label">'+x.routeLabel+'</div>':'')+'<div id="specCard_'+i+'" class="custom'+(soon?' is-approaching eva-card-lock':'')+'"><div class="custom-head"><div class="custom-title">'+x.label+'</div><span class="badge">'+(soon?'<span class="arrival-label">⚡ 特急到站</span>':'本站預測')+'</span></div><div class="custom-pills">'+(a.length?a.map((e,j)=>'<div class="custom-pill '+(j===0&&mins(e.eta)<=1?'arrival-alert':'')+'"><div class="custom-time">'+fmt(e.eta)+'</div><div class="custom-wait">'+mins(e.eta)+'分鐘</div></div>').join(''):'<div class="w-full text-center py-3 text-slate-500">暫無即時到站班次數據</div>')+'</div></div>'}).join('');$('specialCards').innerHTML=html;let hasAlarm=ai>=0;let activeCard=hasAlarm?$('specCard_'+ai):null;setEva(hasAlarm,activeCard);$('specialUpdated').textContent='最後更新時間：'+new Date().toLocaleTimeString()}

/* 出發快捷路線 */
function quick71(){start('[九巴／龍運] 71A','富亨總站 往 大埔墟站',async()=>{loading(true);try{let r=await getEtaForStop('71A','outbound','1',1);cards([{routeLabel:'71A 大埔（富亨） 往 大埔墟站',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick71b(){start('[九巴／龍運] 71B','富亨總站 往 大埔中心（循環線）',async()=>{loading(true);try{let r=await getEtaForStop('71B','outbound','1',1);cards([{routeLabel:'71B 大埔（富亨） 往 大埔中心(循環線)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick271Out(){start('[九巴／龍運] 271','富亨總站 往 西九龍站',async()=>{loading(true);try{let r=await getEtaForStop('271','outbound','1',1);cards([{routeLabel:'271 大埔（富亨） 往 高鐵(西九龍站)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick72x(){start('[九巴／龍運] 72X','頌雅路 往 旺角(柏景灣)',async()=>{loading(true);try{let r=await getEtaForStop('72X','outbound','1','頌雅路');cards([{routeLabel:'72X 大埔中心 往 旺角(柏景灣)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

/* 回家快捷路線 */
function quick71Return(){start('[九巴／龍運] 71A','大埔墟站 往 富亨總站',async()=>{loading(true);try{let r=await getEtaForStop('71A','inbound','1','大埔墟');cards([{routeLabel:'71A 大埔墟站 往 大埔（富亨）',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick71bReturn(){start('[九巴／龍運] 71B','大埔中心 往 富亨總站',async()=>{loading(true);try{let r=await getEtaForStop('71B','outbound','1','大埔中心');cards([{routeLabel:'71B 大埔中心 往 大埔（富亨）',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick271Return(){start('[九巴／龍運] 271','廣福道轉車站 往 富亨總站',async()=>{loading(true);try{let r=await getEtaForStop('271','inbound','1','廣福道');cards([{routeLabel:'271 高鐵(西九龍站) 往 大埔(富亨)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick72xReclamation(){start('[九巴／龍運] 72X','新填地街 往 富蝶總站',async()=>{loading(true);try{let r=await getEtaForStop('72X','inbound','1','新填地街');cards([{routeLabel:'72X 旺角(柏景灣) 往 大埔(富蝶)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

function quick72xMongKok(){start('[九巴／龍運] 72X','旺角道 往 富蝶總站',async()=>{loading(true);try{let r=await getEtaForStop('72X','inbound','1','旺角道');cards([{routeLabel:'72X 旺角(柏景灣) 往 大埔(富蝶)',label:`${r.seq}. ${r.name}`,etas:r.etas}])}finally{loading(false)}})}

async function choose(x){routeItem=x;loading(true);try{let rs=(await get(API+'/route-stop/'+x.route+'/'+x.bound+'/'+x.service)).data,ds=await Promise.all(rs.map(s=>get(API+'/stop/'+s.stop).catch(()=>({data:null}))));stops=rs.map((s,i)=>({seq:+s.seq,stop:s.stop,name:ds[i].data?.name_tc||'未知車站'}));$('stops').innerHTML=stops.map((s,i)=>'<div id="stop'+i+'" class="stop"><span class="dot"></span><div class="stop-head" onclick="toggle('+i+')"><span>'+s.seq+'. '+s.name+'</span><span id="arr'+i+'">▼</span></div><div class="detail" id="detail'+i+'">正在載入到站時間...</div></div>').join('');$('headMain').textContent='[九巴／龍運] '+x.route;$('headSub').textContent=x.desc+'：'+x.orig+' 往 '+x.dest;$('headSub').style.display='block';setStep(4);clearInterval(timer);timer=setInterval(()=>{if(step===4&&selected!==null)fetchEta(selected)},15000)}catch{alert('載入車站失敗')}finally{loading(false)}}

async function fetchEta(i){if(i===null||step!==4)return setEva(false);let ids=(i===0?[0,1]:i===stops.length-1?[i-1,i]:[i-1,i,i+1]).filter(n=>n>=0&&n<stops.length),dir=routeItem.bound==='outbound'?'O':'I',alarm=false;await Promise.all(ids.map(async n=>{let s=stops[n],d=$('detail'+n),tar=n===i;try{let a=up(((await get(API+'/eta/'+s.stop+'/'+routeItem.route+'/'+routeItem.service)).data||[]).filter(x=>x.eta&&x.dir===dir)),soon=tar&&a[0]&&mins(a[0].eta)<=1;if(soon)alarm=true;d.innerHTML='<div class="'+(tar?'eta target':'eta')+'"><div class="eta-title"><span>'+s.seq+'. '+s.name+'</span><span class="badge">'+(tar?(soon?'<span class="arrival-label">⚡ 特急到站</span>':'🎯 點選車站'):'鄰近車站')+'</span></div><div class="etas">'+(a.length?a.slice(0,3).map((x,j)=>'<div class="pill '+(tar&&j===0&&mins(x.eta)<=1?'arrival-alert':'')+'"><div class="time">'+fmt(x.eta)+'</div><div class="wait">'+mins(x.eta)+'分鐘</div></div>').join(''):'<span class="text-sm text-slate-500">暫無實時到站數據</span>')+'</div></div>'}catch{d.textContent='暫未能讀取到站資料'}}));let curStop=$('stop'+i);if(curStop){curStop.classList.toggle('is-approaching',alarm)}setEva(alarm,curStop);$('updated').textContent='最後更新時間：'+new Date().toLocaleTimeString()}

async function toggle(i){if(selected===i){document.querySelectorAll('.stop').forEach(x=>x.classList.remove('expanded','target-selected','is-approaching'));document.querySelectorAll('[id^=arr]').forEach(x=>x.textContent='▼');selected=null;return setEva(false)}selected=i;let ids=(i===0?[0,1]:i===stops.length-1?[i-1,i]:[i-1,i,i+1]).filter(n=>n>=0&&n<stops.length);document.querySelectorAll('.stop').forEach(x=>x.classList.remove('expanded','target-selected','is-approaching'));document.querySelectorAll('[id^=arr]').forEach(x=>x.textContent='▼');ids.forEach(n=>{$('stop'+n).classList.add('expanded');$('arr'+n).textContent='▲';if(n===i)$('stop'+n).classList.add('target-selected')});$('stop'+i).scrollIntoView({behavior:'smooth',block:'center'});await fetchEta(i)}

home();setInterval(()=>{if(step===2)home()},15000);
</script></body></html>
