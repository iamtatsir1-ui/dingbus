const API='https://data.etabus.gov.hk/v1/transport/kmb',$=id=>document.getElementById(id);let step=2,routeItem,stops=[],timer,cache,cacheAt=0,busy=false,selected=null;function loading(on,msg='正在讀取數據...'){$('load').style.display=on?'flex':'none';$('loadText').textContent=msg}async function get(u){let c=new AbortController,t=setTimeout(()=>c.abort(),9000);try{let r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error();return r.json()}finally{clearTimeout(t)}}async function routes(){if(cache&&Date.now()-cacheAt<6e4)return cache;cache=(await get(API+'/route/')).data||[];cacheAt=Date.now();return cache}function setEva(on,target){$('evaOverlay').style.display=on?'block':'none';$('header').classList.toggle('eva-header',on);document.querySelectorAll('.eva-card-lock').forEach(x=>x.classList.remove('eva-card-lock'));if(on&&target)target.classList.add('eva-card-lock')}function setStep(n){step=n;[2,3,4,5,6].forEach(i=>$('step'+i).classList.toggle('active',i===n));$('back').style.display=n>2?'block':'none';$('header').classList.toggle('kmb',n===4||n===5);$('header').classList.toggle('love',n===6);if(n===2||n===3||n===6)setEva(false);if(n===2){$('headMain').textContent='心愛老婆專用即時到站查詢';$('headSub').style.display='none';home()}if(n!==4&&n!==5){clearInterval(timer);selected=null}}function goBack(){setEva(false);setStep(step===5||step===6?2:step-1)}function fmt(t){return new Date(t).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:true})}function mins(t){return Math.max(0,Math.round((new Date(t)-Date.now())/6e4))}function up(a){return a.filter(x=>x?.eta&&new Date(x.eta)>new Date()).sort((a,b)=>new Date(a.eta)-new Date(b.eta))}function two(a){let x=up(a).slice(0,2);return x.length?x.map(e=>fmt(e.eta)+'（尚餘'+mins(e.eta)+'分鐘）').join('；'):'暫無即時班次'}function lines(l,a){return '<span class="eta-line">'+l+'：'+two(a)+'</span>'}function checkEasterEgg(){let x=$('route').value.trim()==='1227';$('searchBtn').classList.toggle('btn-gold',x);$('searchBtn').textContent=x?'幸福快車查詢':'查詢九巴和龍運巴士路線'}function love(){let s=new Date(2014,11,27),n=new Date(),d=Math.floor((n-s)/864e5)+1;$('headMain').textContent='幸福快車專用查詢';$('headSub').textContent='心愛老婆專屬';$('headSub').style.display='block';$('loveContent').innerHTML='<p class="text-lg font-bold text-rose-600">心愛的 Ding3 Ding1：</p><p>你已跟心愛老公相愛了 <span class="text-2xl love-days-highlight">'+d+'</span> 天</p><p>如想了解更多，請立即打電話給老公！</p><p class="text-right text-rose-600">心愛老公上</p>';setStep(6)}async function eta(stop,r,sv,o,d){try{let v=(await routes()).find(x=>x.route===r&&String(x.service_type)===String(sv)&&x.orig_tc.includes(o)&&x.dest_tc.includes(d));return v?((await get(API+'/eta/'+stop+'/'+r+'/'+sv)).data||[]).filter(x=>x.eta&&x.dir===v.bound):[]}catch{return[]}}async function eta74(){try{let a=(await routes()).filter(x=>x.route==='74X'&&x.bound==='O'),v=a.find(x=>x.service_type==='1')||a[0],rs=(await get(API+'/route-stop/74X/outbound/'+v.service_type)).data||[],s=rs.find(x=>+x.seq===5);return((await get(API+'/eta/'+s.stop+'/74X/'+v.service_type)).data||[]).filter(x=>x.eta&&x.dir==='O')}catch{return[]}}async function eta271(){try{let a=(await routes()).filter(x=>x.route==='271'&&x.dest_tc.includes('富亨')),v=a.find(x=>x.service_type==='1')||a[0],rs=(await get(API+'/route-stop/271/'+(v.bound==='O'?'outbound':'inbound')+'/'+v.service_type)).data||[],s=rs.find(x=>+x.seq===21)||rs[0];return((await get(API+'/eta/'+s.stop+'/271/'+v.service_type)).data||[]).filter(x=>x.eta&&x.dir===v.bound)}catch{return[]}}async function home(){if(step!==2||busy)return;busy=true;try{let[a,b,c,d,e,f,g]=await Promise.all([eta('EDDFFB9424A5582C','71A','1','富亨','大埔墟'),eta74(),eta('7FB952821E3FCAD2','3M','1','彩雲','慈雲山(北)'),eta('87825C8E4FE99CD8','5','1','尖沙咀碼頭','富山邨'),eta('E89B2315750AB2FD','74X','1','觀塘碼頭','大埔中心'),eta('E89B2315750AB2FD','74B','1','九龍灣','大埔中心'),eta271()]);if(step===2){$('p71').textContent=two(a);$('p74').textContent=two(b);$('p3m5').innerHTML=lines('3M',c)+lines('5',d);$('p74r').innerHTML=lines('74X',e)+lines('74B',f);$('p271').textContent=two(g)}}finally{busy=false}}async function searchRoute(){let r=$('route').value.trim().toUpperCase();if(!r)return alert('請輸入路線號碼！');if(r==='1227')return love();loading(true);try{let d=(await routes()).filter(x=>x.route===r).map(x=>({route:x.route,bound:x.bound==='O'?'outbound':'inbound',service:x.service_type,orig:x.orig_tc,dest:x.dest_tc,desc:x.service_type==='1'?'常規班次':'特別班次 '+x.service_type}));if(!d.length)throw Error('找不到相關路線');$('bounds').innerHTML='';d.forEach(x=>{let b=document.createElement('button');b.className='option';b.innerHTML='<span><b class="tag">九巴／龍運</b>　'+x.desc+'：'+x.orig+' 往 '+x.dest+'</span><span>→</span>';b.onclick=()=>choose(x);$('bounds').appendChild(b)});setStep(3)}catch(e){alert(e.message||'查詢網絡失敗')}finally{loading(false)}}function start(a,b,fn){setStep(5);$('headMain').textContent=a;$('headSub').textContent=b;$('headSub').style.display='block';fn();clearInterval(timer);timer=setInterval(fn,15000)}function cards(c){let ai=-1;$('specialCards').innerHTML=c.map((x,i)=>{let a=up(x.etas);if(ai<0&&a[0]&&mins(a[0].eta)<=1)ai=i;return(x.routeLabel?'<div class="route-label">'+x.routeLabel+'</div>':'')+'<div id="specCard_'+i+'" class="custom"><div class="custom-head"><div class="custom-title">'+x.label+'</div><span class="badge">本站預測</span></div><div class="custom-pills">'+(a.length?a.map((e,j)=>'<div class="custom-pill '+(j===0&&mins(e.eta)<=1?'arrival-alert':'')+'"><div class="custom-time">'+fmt(e.eta)+'</div><div class="custom-wait">'+mins(e.eta)+'分鐘</div></div>').join(''):'<div class="w-full text-center py-3 text-slate-500">暫無即時到站班次數據</div>')+'</div></div>'}).join('');setEva(ai>=0,$('specCard_'+ai));$('specialUpdated').textContent='最後更新時間：'+new Date().toLocaleTimeString()}function quick71(){start('[九巴／龍運] 71A','富亨總站（TP991）往 大埔墟站',async()=>{loading(true);try{cards([{routeLabel:'71A大埔（富亨） 往 大埔墟站',label:'1. 富亨總站 (TP991)',etas:await eta('EDDFFB9424A5582C','71A','1','富亨','大埔墟')}])}finally{loading(false)}})}function quick74(){start('[九巴／龍運] 74X','廣福邨（TP576）往 觀塘碼頭',async()=>{loading(true);try{cards([{label:'5. 廣福邨 (TP576)',etas:await eta74()}])}finally{loading(false)}})}function quick3m5(){start('[九巴／龍運] 3M／5','真鐸學校相關車站即時到站預測',async()=>{loading(true);try{let[a,b]=await Promise.all([eta('7FB952821E3FCAD2','3M','1','彩雲','慈雲山(北)'),eta('87825C8E4FE99CD8','5','1','尖沙咀碼頭','富山邨')]);cards([{routeLabel:'3M彩雲 往 慈雲山(北)',label:'4. 彩虹轉車站 - 彩虹總站 (WT995)',etas:a},{routeLabel:'5尖沙咀碼頭 往 富山邨',label:'18. 彩虹轉車站 - 碧海樓 (WT341)',etas:b}])}finally{loading(false)}})}function quick74Return(){start('[九巴／龍運] 74X／74B','志蓮淨苑（WT132）往 大埔中心',async()=>{loading(true);try{let[a,b]=await Promise.all([eta('E89B2315750AB2FD','74X','1','觀塘碼頭','大埔中心'),eta('E89B2315750AB2FD','74B','1','九龍灣','大埔中心')]);cards([{routeLabel:'74X觀塘碼頭 往 大埔中心',label:'5. 志蓮淨苑 (WT132)',etas:a},{routeLabel:'74B九龍灣 往 大埔中心',label:'5. 志蓮淨苑 (WT132)',etas:b}])}finally{loading(false)}})}function quick271(){start('[九巴／龍運] 271','廣福道轉車站（TP279）往 大埔(富亨)',async()=>{loading(true);try{cards([{routeLabel:'271 高鐵(西九龍站) 往 大埔(富亨)',label:'21. 廣福道轉車站 (TP279)',etas:await eta271()}])}finally{loading(false)}})}async function choose(x){routeItem=x;loading(true);try{let rs=(await get(API+'/route-stop/'+x.route+'/'+x.bound+'/'+x.service)).data,ds=await Promise.all(rs.map(s=>get(API+'/stop/'+s.stop).catch(()=>({data:null}))));stops=rs.map((s,i)=>({seq:+s.seq,stop:s.stop,name:ds[i].data?.name_tc||'未知車站'}));$('stops').innerHTML=stops.map((s,i)=>'<div id="stop'+i+'" class="stop"><span class="dot"></span><div class="stop-head" onclick="toggle('+i+')"><span>'+s.seq+'. '+s.name+'</span><span id="arr'+i+'">▼</span></div><div class="detail" id="detail'+i+'">正在載入到站時間...</div></div>').join('');$('headMain').textContent='[九巴／龍運] '+x.route;$('headSub').textContent=x.desc+'：'+x.orig+' 往 '+x.dest;$('headSub').style.display='block';setStep(4);clearInterval(timer);timer=setInterval(()=>{if(step===4&&selected!==null)fetchEta(selected)},15000)}catch{alert('載入車站失敗')}finally{loading(false)}}async function fetchEta(i){if(i===null||step!==4)return setEva(false);let ids=(i===0?[0,1]:i===stops.length-1?[i-1,i]:[i-1,i,i+1]).filter(n=>n>=0&&n<stops.length),dir=routeItem.bound==='outbound'?'O':'I',alarm=false;await Promise.all(ids.map(async n=>{let s=stops[n],d=$('detail'+n),tar=n===i;try{let a=up(((await get(API+'/eta/'+s.stop+'/'+routeItem.route+'/'+routeItem.service)).data||[]).filter(x=>x.eta&&x.dir===dir)),soon=tar&&a[0]&&mins(a[0].eta)<=1;if(soon)alarm=true;d.innerHTML='<div class="'+(tar?'eta target':'eta')+'"><div class="eta-title"><span>'+s.seq+'. '+s.name+'</span><span class="badge">'+(tar?(soon?'<span class="arrival-label">即將到站</span>':'🎯 點選車站'):'鄰近車站')+'</span></div><div class="etas">'+(a.length?a.slice(0,3).map((x,j)=>'<div class="pill '+(tar&&j===0&&mins(x.eta)<=1?'arrival-alert':'')+'"><div class="time">'+fmt(x.eta)+'</div><div class="wait">'+mins(x.eta)+'分鐘</div></div>').join(''):'<span class="text-sm text-slate-500">暫無實時到站數據</span>')+'</div></div>'}catch{d.textContent='暫未能讀取到站資料'}}));setEva(alarm,$('stop'+i));$('updated').textContent='最後更新時間：'+new Date().toLocaleTimeString()}async function toggle(i){if(selected===i){document.querySelectorAll('.stop').forEach(x=>x.classList.remove('expanded','target-selected'));document.querySelectorAll('[id^=arr]').forEach(x=>x.textContent='▼');selected=null;return setEva(false)}selected=i;let ids=(i===0?[0,1]:i===stops.length-1?[i-1,i]:[i-1,i,i+1]).filter(n=>n>=0&&n<stops.length);document.querySelectorAll('.stop').forEach(x=>x.classList.remove('expanded','target-selected'));document.querySelectorAll('[id^=arr]').forEach(x=>x.textContent='▼');ids.forEach(n=>{$('stop'+n).classList.add('expanded');$('arr'+n).textContent='▲';if(n===i)$('stop'+n).classList.add('target-selected')});$('stop'+i).scrollIntoView({behavior:'smooth',block:'center'});await fetchEta(i)}home();setInterval(()=>{if(step===2)home()},15000);
